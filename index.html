<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PVS Johns Creek Pet Club</title>
<meta name="description" content="Earn points and rewards at PVS Johns Creek. Sign in to see your balance, rewards, and offers.">
<meta name="theme-color" content="#0B2A5B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2A5B; --blue:#1456C4; --blue-ink:#0F43A0; --blue-soft:#E6EEFB;
  --red:#D3283C; --red-ink:#B01E31; --red-soft:#FCE8EA;
  --bg:#F3F6FB; --surface:#FFFFFF; --text:#0E1B33; --muted:#53617D; --line:#D3DCEC;
  --ok:#14764A; --ok-soft:#DDF3E8; --tag:#0B2A5B; --on-tag:#FFFFFF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --navy:#091634; --blue:#3B7BF0; --blue-ink:#7FAAFF; --blue-soft:#15264B;
    --red:#F0485B; --red-ink:#FF8B98; --red-soft:#3A1822;
    --bg:#0A1226; --surface:#111C38; --text:#E8EEFB; --muted:#9DAFD1; --line:#25355E;
    --ok:#5CD59B; --ok-soft:#10372A; --tag:#0F2F6B; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0 0 .5rem;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800} h2{font-size:1.35rem;font-weight:700} h3{font-size:1.05rem;font-weight:700}
p{margin:0 0 .75rem} .muted{color:var(--muted)} .small{font-size:.875rem}
a{color:var(--blue-ink)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}
header.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--red);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1100px;margin:0 auto;padding:.75rem 1rem;display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.65rem;font-family:var(--display);font-weight:800;font-size:1.15rem}
.who{display:flex;align-items:center;gap:.6rem;font-size:.85rem;flex-wrap:wrap}
.who .btn{background:rgba(255,255,255,.14);color:#fff} .who .btn:hover{background:rgba(255,255,255,.25)}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1100px;margin:0 auto;padding:0 .5rem;display:flex;gap:.25rem;overflow-x:auto}
.tabs-in button{border:0;background:none;color:var(--muted);font:600 .95rem var(--body);padding:.85rem .9rem;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs-in button[aria-current="page"]{color:var(--blue-ink);border-bottom-color:var(--red)}
.badge{display:inline-block;min-width:1.4em;text-align:center;background:var(--red);color:#fff;border-radius:999px;font-size:.75rem;padding:0 .4em;margin-left:.35rem}
main{max-width:1100px;margin:0 auto;padding:1.25rem 1rem calc(4rem + env(safe-area-inset-bottom,0px))}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem}
.card.flat{border-radius:10px}
.stat b{display:block;font:800 1.7rem var(--display);color:var(--blue-ink)}
.stat span{color:var(--muted);font-size:.875rem}
label{display:block;font-weight:600;font-size:.875rem;margin:.75rem 0 .25rem}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:.55rem .7rem;min-height:2.6rem}
textarea{min-height:5.5rem;resize:vertical}
input[type=checkbox]{width:auto;min-height:0;margin-right:.5rem;accent-color:var(--blue)}
.chk{display:flex;align-items:center;font-weight:500;margin:.75rem 0}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 160px}
.btn{font:700 .95rem var(--body);border:0;border-radius:9px;padding:.65rem 1.1rem;cursor:pointer;background:var(--blue);color:#fff;min-height:2.6rem}
.btn:hover{background:var(--blue-ink)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--red)} .btn.red:hover{background:var(--red-ink)}
.btn.ghost{background:transparent;color:var(--blue-ink);border:1.5px solid var(--line)} .btn.ghost:hover{background:var(--blue-soft)}
.btn.sm{padding:.35rem .7rem;min-height:2rem;font-size:.85rem}
.btn.text{background:none;color:var(--red-ink);padding:.35rem .5rem;min-height:0} .btn.text:hover{background:var(--red-soft)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-weight:700;color:var(--muted);font-size:.8rem;padding:.5rem .6rem;border-bottom:2px solid var(--line)}
td{padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{min-height:2.2rem;padding:.3rem .5rem}
.scroll{overflow-x:auto}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--red-ink);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:.1rem .65rem;font-size:.8rem;font-weight:700;background:var(--blue-soft);color:var(--blue-ink)}
.pill.red{background:var(--red-soft);color:var(--red-ink)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.bar{height:10px;border-radius:99px;background:var(--blue-soft);overflow:hidden;margin:.4rem 0}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.tag{position:relative;background:var(--tag);color:var(--on-tag);border-radius:26px;padding:1.4rem 1.5rem 1.4rem 4.6rem;overflow:hidden}
.tag::before{content:"";position:absolute;left:1.35rem;top:1.5rem;width:1.7rem;height:1.7rem;border-radius:50%;border:5px solid var(--red);background:var(--bg)}
.tag::after{content:"";position:absolute;left:2.05rem;top:3.4rem;width:5px;height:calc(100% - 4.4rem);background:var(--red);border-radius:3px;opacity:.9}
.tag .bal{font:800 3.4rem/1 var(--display);letter-spacing:-.03em}
.tag .bar{background:rgba(255,255,255,.2)} .tag .bar i{background:var(--red)}
.tag .pill{background:#fff;color:var(--navy)}
.ladder{display:grid;gap:.5rem}
.rung{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.65rem .85rem;border:1.5px solid var(--line);border-radius:10px}
.rung.on{border-color:var(--red);background:var(--red-soft)}
.promo{border-left:6px solid var(--red);padding-left:1rem}
.notice{border-radius:10px;padding:.75rem .95rem;background:var(--blue-soft);color:var(--text);font-size:.9rem;margin:.75rem 0}
.notice.warn{background:var(--red-soft)}
.subtabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.subtabs button{border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:600 .9rem var(--body);padding:.45rem .9rem;border-radius:999px;cursor:pointer}
.subtabs button[aria-current="page"]{background:var(--blue);border-color:var(--blue);color:#fff}
.overlay{position:fixed;inset:0;background:rgba(5,12,30,.62);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50}
.modal{background:var(--surface);border-radius:18px;max-width:460px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal .mh{background:var(--red);color:#fff;padding:1.2rem 1.4rem}.modal .mh h2{margin:0;font-size:1.5rem}
.modal .mb{padding:1.2rem 1.4rem}
.price{font:800 2.4rem var(--display);color:var(--blue-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:.7rem 1.1rem;border-radius:10px;z-index:60;font-weight:600;max-width:92vw;border-left:5px solid var(--red)}
.signin{max-width:520px;margin:2rem auto}
.foot{max-width:1100px;margin:0 auto;padding:0 1rem calc(2rem + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:.85rem}
.empty{padding:1.5rem;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px}
@media (max-width:560px){.tag{padding-left:3.8rem}.tag .bal{font-size:2.6rem}h1{font-size:1.5rem}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-host" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ---------- connection (the publishable key is designed to be public) ---------- */
const SUPABASE_URL = "https://buzzntuiwxomhfexboib.supabase.co";
const SUPABASE_KEY = "sb_publishable_IMP_bA9_bbCqbBPurnHVDA_qC85i1Qb";
const SITE_URL = "https://pvs-jc.vercel.app";

/* ---------- helpers ---------- */
const $app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n).toLocaleString("en-US");
const money = n => "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const ppv = v => "$" + Number(v).toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
const fdate = s => s ? new Date(s).toLocaleDateString("en-US") : "";
const todayIso = () => new Date().toISOString().slice(0, 10);
const nameOf = r => (r && r.clients && r.clients.full_name) || "Unknown";
function setPath(obj, path, val) { const k = path.split("."); let o = obj; for (let i = 0; i < k.length - 1; i++) o = o[k[i]]; o[k[k.length - 1]] = val; }
function toast(m) {
  const h = document.getElementById("toast-host");
  h.innerHTML = '<div class="toast" role="status">' + esc(m) + "</div>";
  clearTimeout(toast.t); toast.t = setTimeout(() => { h.innerHTML = ""; }, 4200);
}
function msg(e) {
  const m = e && e.message ? String(e.message) : "";
  if (m.includes("clients_email_unique")) return "A client with that email already exists.";
  if (m.includes("row-level security")) return "You don’t have permission to do that.";
  return m || "Something went wrong. Please try again.";
}
async function q(p) { const r = await p; if (r.error) throw r.error; return r.data; }
const rpc = (n, a) => q(sb.rpc(n, a || {}));

let sb = null;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}}); } catch (e) { sb = null; }

const st = {ready: false, user: null, role: null, client: null, boot: null, cfg: {s: null, appts: [], tiers: [], promos: []}, d: {badge: {recipes: 0}}};
const ui = {tab: null, settingsTab: "points", modal: null, sent: false, email: "", loading: false, busy: false,
  awardClient: "", redeemClient: "", award: {ref: "", typeId: "", spend: ""}, filter: "", notes: {},
  recipe: {title: "", pet: "Dogs", ingredients: "", steps: ""}, newClient: {name: "", email: "", phone: "", pets: ""},
  newPet: {clientId: "", name: "", species: "Dog"}, team: {email: "", role: "staff"}, error: ""};

/* ---------- config and calculations ---------- */
async function loadConfig() {
  const [s, appts, tiers, promos] = await Promise.all([
    q(sb.from("program_settings").select("*").eq("id", 1).single()),
    q(sb.from("appointment_types").select("*").order("name")),
    q(sb.from("tiers").select("*").order("min_lifetime_points")),
    q(sb.from("promotions").select("*").order("name"))
  ]);
  st.cfg = {s, appts, tiers, promos};
}
const S = () => st.cfg.s;
const tierFor = life => { let cur = st.cfg.tiers[0]; st.cfg.tiers.forEach(t => { if (life >= t.min_lifetime_points) cur = t; }); return cur || {name: "Member", min_lifetime_points: 0, value_per_point: 0}; };
const nextTier = life => st.cfg.tiers.find(t => t.min_lifetime_points > life);
const rewardValue = life => Math.round(S().reward_threshold * tierFor(life).value_per_point * 100) / 100;
const isStaff = () => st.role === "staff" || st.role === "manager";

/* ---------- loaders (one per screen) ---------- */
async function loadBadges() {
  if (!isStaff()) return;
  const a = await sb.from("recipes").select("id", {count: "exact", head: true}).eq("status", "pending");
  st.d.badge = {recipes: a.count || 0};
}
async function refreshClient() {
  st.client = await q(sb.from("clients").select("*, pets(*)").eq("user_id", st.user.id).maybeSingle());
}
async function loadInfo(id) {
  if (!id) { st.d.info = null; return; }
  const [c, b] = await Promise.all([q(sb.from("clients").select("*, pets(*)").eq("id", id).single()), q(sb.from("client_balances").select("*").eq("client_id", id).single())]);
  st.d.info = {client: c, bal: b};
}
async function loadClientList() {
  st.d.clients = await q(sb.from("clients").select("id, full_name, email, phone, user_id, pets(name, species)").order("full_name"));
}
const LOAD = {
  async c_home() { st.d.bal = await q(sb.from("client_balances").select("*").eq("client_id", st.client.id).single()); },
  async c_activity() { st.d.ledger = await q(sb.from("point_ledger").select("*").eq("client_id", st.client.id).order("created_at", {ascending: false}).limit(200)); },
  async c_recipes() { st.d.myRecipes = await q(sb.from("recipes").select("*").eq("client_id", st.client.id).order("created_at", {ascending: false})); },
  async award() { await loadClientList(); await loadInfo(ui.awardClient); st.d.recent = await q(sb.from("point_ledger").select("*, clients(full_name)").order("created_at", {ascending: false}).limit(6)); },
  async redeem() { await loadClientList(); await loadInfo(ui.redeemClient); },
  async s_recipes() {
    st.d.queue = await q(sb.from("recipes").select("*, clients(full_name)").eq("status", "pending").order("created_at"));
    st.d.rdone = await q(sb.from("recipes").select("*, clients(full_name)").neq("status", "pending").order("created_at", {ascending: false}).limit(8));
    await loadBadges();
  },
  async clients() {
    await loadClientList();
    const b = await q(sb.from("client_balances").select("*"));
    st.d.bmap = {}; b.forEach(x => { st.d.bmap[x.client_id] = x; });
  },
  async dash() {
    const [bals, redeems, recent, cnt] = await Promise.all([
      q(sb.from("client_balances").select("*")),
      q(sb.from("point_ledger").select("dollars_value").eq("entry_type", "redeem")),
      q(sb.from("point_ledger").select("*, clients(full_name)").order("created_at", {ascending: false}).limit(8)),
      loadBadges()
    ]);
    st.d.dash = {bals, redeems, recent};
  },
  async settings() {
    await loadConfig();
    st.d.team = await q(sb.from("staff_roles_pending").select("*").order("email"));
  }
};
async function go(tab) {
  ui.tab = tab; ui.loading = true; render();
  try { if (LOAD[tab]) await LOAD[tab](); } catch (e) { toast(msg(e)); }
  ui.loading = false; render();
}
const reload = () => go(ui.tab);

/* ---------- session ---------- */
async function bootstrap(session) {
  if (st.boot === session.user.id && st.role) return;
  st.boot = session.user.id; st.user = session.user; ui.error = "";
  try {
    const prof = await q(sb.from("profiles").select("role").eq("id", session.user.id).maybeSingle());
    st.role = prof ? prof.role : "client";
    await loadConfig();
    if (st.role === "client") {
      try { await rpc("claim_client"); } catch (e) { /* optional helper; ignore if not installed */ }
      await refreshClient();
    } else { st.client = null; }
    ui.tab = st.role === "client" ? "c_home" : st.role === "manager" ? "dash" : "award";
    await loadBadges();
    ui.modal = null;
    st.ready = true; await go(ui.tab);
  } catch (e) {
    ui.error = msg(e); st.ready = true; st.role = st.role || "error"; render();
  }
}
function resetSession() { st.user = null; st.role = null; st.client = null; st.boot = null; st.d = {badge: {recipes: 0}}; ui.modal = null; ui.sent = false; ui.error = ""; ui.awardClient = ""; ui.redeemClient = ""; }

/* ---------- shared views ---------- */
function header() {
  const logo = '<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#fff"/><circle cx="12" cy="13" r="3.2" fill="#D3283C"/><circle cx="22" cy="13" r="3.2" fill="#D3283C"/><circle cx="7.5" cy="19.5" r="2.7" fill="#1456C4"/><circle cx="26.5" cy="19.5" r="2.7" fill="#1456C4"/><path d="M17 17.5c-4 0-7 3-7 5.6 0 2 1.7 3 3.6 3 1.3 0 2.2-.5 3.4-.5s2.1.5 3.4.5c1.9 0 3.6-1 3.6-3 0-2.6-3-5.6-7-5.6z" fill="#0B2A5B"/></svg>';
  const who = st.user ? '<div class="who"><span>' + esc(st.user.email) + '</span><span class="pill">' + esc(st.role === "manager" ? "Manager" : st.role === "staff" ? "Staff" : "Client") + '</span><button class="btn sm" data-act="signout">Sign out</button></div>' : "";
  return '<header class="top"><div class="top-in"><div class="brand">' + logo + "<span>" + esc(st.cfg.s ? S().program_name : "PVS Johns Creek Pet Club") + "</span></div>" + who + "</div></header>";
}
const TABS = {
  client: [["c_home", "Home"], ["c_activity", "Activity"], ["c_recipes", "Recipes"], ["c_offers", "Offers"]],
  staff: [["award", "Award points"], ["redeem", "Redeem"], ["s_recipes", "Recipe reviews", "recipes"], ["clients", "Clients"]],
  manager: [["dash", "Dashboard"], ["award", "Award points"], ["redeem", "Redeem"], ["s_recipes", "Recipe reviews", "recipes"], ["clients", "Clients"], ["settings", "Settings"]]
};
function tabsNav() {
  if (!st.user || !TABS[st.role] || (st.role === "client" && !st.client)) return "";
  return '<nav class="tabs" aria-label="Sections"><div class="tabs-in">' + TABS[st.role].map(t => {
    const n = t[2] ? (st.d.badge[t[2]] || 0) : 0;
    return '<button data-act="tab" data-v="' + t[0] + '"' + (ui.tab === t[0] ? ' aria-current="page"' : "") + ">" + t[1] + (n ? '<span class="badge">' + n + "</span>" : "") + "</button>";
  }).join("") + "</div></nav>";
}
function signinView() {
  if (ui.sent) return '<div class="signin card"><h1>Check your email</h1><p>We sent a sign-in link to <b>' + esc(ui.email) + '</b>. Open it on this device to finish signing in. It can take a minute to arrive, so check your spam folder too.</p><button class="btn ghost" data-act="again">Use a different email</button></div>';
  return '<div class="signin card"><h1>Sign in</h1><p class="muted">Enter your email and we’ll send you a secure sign-in link. No password needed. Clients: use the email the clinic has on file. New to the Pet Club? Ask the front desk to add your email.</p><label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email" data-ui="email" value="' + esc(ui.email) + '"><p style="margin-top:1rem"><button class="btn red" data-act="sendLink">Email me a link</button></p></div>';
}
const footer = () => '<footer class="foot"><a href="/privacy.html">Privacy policy</a> · <a href="/terms.html">Program terms</a></footer>';
const loadingView = () => '<div class="card"><p class="muted" style="margin:0">Loading…</p></div>';

/* ---------- client views ---------- */
function cHome() {
  const c = st.client, b = st.d.bal || {balance: 0, lifetime: 0}, t = tierFor(b.lifetime), nt = nextTier(b.lifetime), th = S().reward_threshold;
  const val = rewardValue(b.lifetime), pct = Math.min(100, Math.round(b.balance / th * 100));
  const lp = nt ? Math.min(100, Math.round((b.lifetime - t.min_lifetime_points) / (nt.min_lifetime_points - t.min_lifetime_points) * 100)) : 100;
  return '<div class="grid g2"><div class="tag"><div class="small" style="opacity:.85">Hi ' + esc(c.full_name.split(" ")[0]) + ', you have</div><div class="bal">' + fmt(b.balance) + '</div><div style="margin-bottom:.6rem">points <span class="pill" style="margin-left:.4rem">' + esc(t.name) + "</span></div>" +
    '<div class="small">' + (b.balance >= th ? "<b>Reward ready:</b> " + money(val) + " off eligible veterinary services. Ask the front desk to apply it." : fmt(th - b.balance) + " points until a " + money(val) + " reward") + '</div><div class="bar" aria-hidden="true"><i style="width:' + pct + '%"></i></div><div class="small" style="opacity:.85">Each point is worth ' + ppv(t.value_per_point) + " at " + esc(t.name) + ". " + fmt(th) + " points = " + money(val) + ".</div></div>" +
    '<div class="card"><h2>Your level: ' + esc(t.name) + "</h2>" + (nt ? '<p class="muted">' + fmt(nt.min_lifetime_points - b.lifetime) + " more points to reach " + esc(nt.name) + ", where points are worth " + ppv(nt.value_per_point) + ' each.</p><div class="bar"><i style="width:' + lp + '%"></i></div>' : '<p class="muted">You’ve reached our highest level.</p>') +
    '<p class="small muted">Levels use all points you’ve ever earned, so redeeming a reward never lowers your level.</p>' + "</div></div>" +

  else if (!st.user) main = signinView();
  else if (st.role === "error") main = '<div class="signin card"><h1>Something went wrong</h1><p class="muted">' + esc(ui.error) + '</p><p><button class="btn" data-act="retry">Try again</button> <button class="btn ghost" data-act="signout">Sign out</button></p></div>';
  else if (st.role === "client" && !st.client) main = '<div class="signin card"><h1>We couldn’t find your club account</h1><p class="muted">You’re signed in as <b>' + esc(st.user.email) + "</b>, but the clinic doesn’t have a club account for that email yet. Please ask the front desk to add you using this email address, then refresh this page.</p></div>";
  else main = ui.loading ? loadingView() : (VIEW[ui.tab] ? VIEW[ui.tab]() : "");
  $app.innerHTML = header() + tabsNav() + "<main>" + main + "</main>" + footer();
  const f = $app.querySelector("[data-focus]"); if (f) f.focus();
}

/* ---------- actions ---------- */
async function run(fn, ok) {
  if (ui.busy) return; ui.busy = true;
  try { const r = await fn(); if (ok) toast(typeof ok === "function" ? ok(r) : ok); return r; }
  catch (e) { toast(msg(e)); } finally { ui.busy = false; }
}
async function saveField(el) {
  const d = el.dataset; let v;
  if (d.type === "bool") v = el.checked;
  else if (d.type === "num" || d.type === "int" || d.type === "cents") {
    v = parseFloat(el.value); if (!(v >= 0)) v = 0;
    if (d.type === "int") v = Math.round(v); if (d.type === "cents") v = Math.round(v * 100);
  } else v = el.value.trim();
  if (d.col === "name" && !v) { toast("Name can’t be empty."); return; }
  await run(async () => {
    const rows = await q(sb.from(d.tbl).update({[d.col]: v}).eq("id", d.id).select());
    if (!rows || !rows.length) throw new Error("Not saved. You may not have permission.");
    await loadConfig();
    document.querySelectorAll("[data-derive]").forEach(n => { const tr = st.cfg.tiers.find(x => x.id === n.dataset.derive); if (tr) n.textContent = money(S().reward_threshold * tr.value_per_point); });
    if (d.col === "program_name") render();
  }, "Saved");
}
const A = {
  async sendLink() {
    const email = ui.email.trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(email)) return toast("Enter a valid email address.");
    await run(async () => {
      const {error} = await sb.auth.signInWithOtp({email, options: {emailRedirectTo: location.origin + "/", shouldCreateUser: true}});
      if (error) throw new Error(/rate|limit|seconds/i.test(error.message) ? "Too many sign-in emails were requested. Please wait a few minutes and try again." : error.message);
      ui.email = email; ui.sent = true; render();
    });
  },
  again() { ui.sent = false; render(); },
  async signout() { try { await sb.auth.signOut(); } catch (e) {} resetSession(); render(); },
  retry() { st.boot = null; st.role = null; sb.auth.getSession().then(r => { if (r.data.session) bootstrap(r.data.session); else { resetSession(); render(); } }); },
  tab(el) { go(el.dataset.v); },
  stab(el) { ui.settingsTab = el.dataset.v; render(); },
  async submitRecipe() {
    const r = ui.recipe;
    if (!r.title.trim() || !r.ingredients.trim() || !r.steps.trim()) return toast("Add a recipe name, ingredients, and directions.");
    const ok = await run(async () => { await rpc("submit_recipe", {p_title: r.title, p_pet: r.pet, p_ingredients: r.ingredients, p_directions: r.steps}); return true; }, "Recipe submitted for review.");
    if (ok) { ui.recipe = {title: "", pet: "Dogs", ingredients: "", steps: ""}; reload(); }
  },
  async approveRecipe(el) { const ok = await run(() => rpc("review_recipe", {p_id: el.dataset.id, p_approve: true, p_note: ui.notes[el.dataset.id] || null}).then(() => true), "Approved. Points added."); if (ok) reload(); },
  async declineRecipe(el) { const ok = await run(() => rpc("review_recipe", {p_id: el.dataset.id, p_approve: false, p_note: ui.notes[el.dataset.id] || null}).then(() => true), "Recipe declined."); if (ok) reload(); },
  async award() {
    const a = ui.award, spend = parseFloat(a.spend);
    if (!ui.awardClient) return toast("Choose a client.");
    if (!a.ref.trim()) return toast("Enter the invoice or visit number.");
    if (!a.typeId) return toast("Choose an appointment type.");
    if (!(spend >= 0)) return toast("Enter the eligible spend (0 if none).");
    const r = await run(() => rpc("award_points", {p_client: ui.awardClient, p_invoice: a.ref, p_type: a.typeId, p_spend: spend}), r => fmt(r.awarded) + " points added. New balance: " + fmt(r.balance) + ".");
    if (r) { ui.award = {ref: "", typeId: "", spend: ""}; reload(); }
  },
  async redeem() {
    const r = await run(() => rpc("redeem_reward", {p_client: ui.redeemClient}), r => money(r.dollars) + " reward redeemed. Remaining: " + fmt(r.balance) + " points.");
    if (r) reload();
  },
  async addClient() {
    const n = ui.newClient, email = n.email.trim().toLowerCase();
    if (!n.name.trim() || !/^\S+@\S+\.\S+$/.test(email)) return toast("Enter the client’s name and a valid email.");
    const ok = await run(async () => {
      const c = await q(sb.from("clients").insert({full_name: n.name.trim(), email, phone: n.phone.trim() || null}).select().single());
      const pets = n.pets.split(",").map(x => x.trim()).filter(Boolean).map(x => { const m = /^(.+?)\s*\((.+)\)\s*$/.exec(x); return {client_id: c.id, name: m ? m[1] : x, species: m ? m[2] : "Dog"}; });
      if (pets.length) await q(sb.from("pets").insert(pets));
      return true;
    }, "Client added. They can sign in with that email.");
    if (ok) { ui.newClient = {name: "", email: "", phone: "", pets: ""}; reload(); }
  },
  async addPet() {
    const p = ui.newPet; if (!p.clientId || !p.name.trim()) return toast("Choose a client and enter the pet’s name.");
    const ok = await run(() => q(sb.from("pets").insert({client_id: p.clientId, name: p.name.trim(), species: p.species})).then(() => true), "Pet added.");
    if (ok) { ui.newPet.name = ""; reload(); }
  },
  async addAppt() { const ok = await run(() => q(sb.from("appointment_types").insert({name: "New appointment type", bonus_points: 50})).then(() => true)); if (ok) { await loadConfig(); render(); } },
  async addTier() { const max = Math.max(0, ...st.cfg.tiers.map(t => t.min_lifetime_points)); const ok = await run(() => q(sb.from("tiers").insert({name: "New level", min_lifetime_points: max + 5000, value_per_point: 0.02})).then(() => true)); if (ok) { await loadConfig(); render(); } },
  async delTier(el) { if (st.cfg.tiers.length < 2) return; const ok = await run(() => q(sb.from("tiers").delete().eq("id", el.dataset.id)).then(() => true)); if (ok) { await loadConfig(); render(); } },
  async addPromo() { const ok = await run(() => q(sb.from("promotions").insert({name: "New promotion", kind: "percent", value: 10, note: "Describe who qualifies.", active: false})).then(() => true)); if (ok) { await loadConfig(); render(); } },
  async delPromo(el) { const ok = await run(() => q(sb.from("promotions").delete().eq("id", el.dataset.id)).then(() => true)); if (ok) { await loadConfig(); render(); } },
  async addTeam() {
    const em = ui.team.email.trim().toLowerCase(); if (!/^\S+@\S+\.\S+$/.test(em)) return toast("Enter a valid work email.");
    const ok = await run(() => rpc("set_staff_role", {p_email: em, p_role: ui.team.role}).then(() => true), "Access granted. They sign in with that email.");
    if (ok) { ui.team.email = ""; reload(); }
  },
  async removeTeam(el) { const ok = await run(() => rpc("set_staff_role", {p_email: el.dataset.email, p_role: "client"}).then(() => true), "Access removed."); if (ok) reload(); },
  async csv() {
    await run(async () => {
      const rows = await q(sb.from("point_ledger").select("*, clients(full_name)").order("created_at", {ascending: false}).limit(20000));
      const qt = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
      const lines = [["Date", "Client", "Type", "Points", "Description", "Reference"]].concat(rows.map(e => [e.created_at, nameOf(e), e.entry_type, e.points, e.note, e.invoice_ref || ""]));
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([lines.map(r => r.map(qt).join(",")).join("\n")], {type: "text/csv"}));
      a.download = "pet-club-points-ledger.csv"; document.body.appendChild(a); a.click(); a.remove();
    }, "Ledger exported.");
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || !A[el.dataset.act]) return;
  A[el.dataset.act](el, e);
});
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset) return;
  if (el.dataset.note) { ui.notes[el.dataset.note] = el.value; return; }
  if (!el.dataset.ui) return;
  setPath(ui, el.dataset.ui, el.value);
  if (el.dataset.ui === "filter") { const p = document.getElementById("pick"); if (p) p.innerHTML = pickOptions(ui.tab === "redeem" ? ui.redeemClient : ui.awardClient); }
  if (el.dataset.ui.startsWith("award.")) { const p = document.getElementById("award-preview"); if (p) p.innerHTML = awardPreview(); }
});
document.addEventListener("change", async e => {
  const el = e.target; if (!el.dataset) return;
  if (el.hasAttribute("data-pick")) {
    if (ui.tab === "redeem") ui.redeemClient = el.value; else ui.awardClient = el.value;
    ui.loading = true; render();
    try { await loadInfo(el.value); } catch (err) { toast(msg(err)); }
    ui.loading = false; render(); return;
  }
  if (el.dataset.tbl) { saveField(el); return; }
  if (el.dataset.ui === "award.typeId") { const p = document.getElementById("award-preview"); if (p) p.innerHTML = awardPreview(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target && e.target.id === "em") A.sendLink();
});

/* ---------- start ---------- */
async function init() {
  render();
  if (!sb) return;
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT") { resetSession(); render(); }
    else if (session && event === "SIGNED_IN") setTimeout(() => bootstrap(session), 0);
  });
  try {
    const {data} = await sb.auth.getSession();
    if (data.session) await bootstrap(data.session); else { st.ready = true; render(); }
  } catch (e) { st.ready = true; render(); }
}
init();
</script>
